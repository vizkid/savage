<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 220px; margin: 0; padding: 12px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 5px 7px; font: inherit; }
  #hint { color: #666; margin-top: 6px; }
</style>
<label for="px">Output size (px, longest side)</label>
<input id="px" type="number" min="256" max="8192" step="1" placeholder="2048">
<div id="hint">256–8192 · empty = 2048</div>
<script src="config.js"></script>
<script src="popup.js"></script>
