<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAFAF7;
    --ink: #20242B;
    --muted: #6E6A5F;
    --line: rgba(32, 36, 43, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1D2026;
      --ink: #ECE9E2;
      --muted: #9B978C;
      --line: rgba(236, 233, 226, .25);
    }
  }
  body {
    font: 13px system-ui, sans-serif;
    width: 240px; margin: 0; padding: 12px;
    background: var(--bg); color: var(--ink);
  }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input[type="number"] {
    width: 100%; box-sizing: border-box; padding: 5px 7px; font: inherit;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .hint { color: var(--muted); margin-top: 6px; }
  .row { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; font-weight: 600; }
  .row input { margin-top: 2px; }
</style>
<label for="px">Output size (px, longest side)</label>
<input id="px" type="number" min="256" max="8192" step="1" placeholder="2048">
<div class="hint">256–8192 · empty = 2048</div>
<label class="row"><input type="checkbox" id="allsites"><span>Fetch dragged SVGs from any site</span></label>
<div class="hint">Off: drags work from sites that allow cross-origin requests (Wikipedia does). On: grants access to all sites, used only to fetch URLs you drag.</div>
<script src="config.js"></script>
<script src="popup.js"></script>
